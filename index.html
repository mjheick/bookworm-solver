<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookworm Solver</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 1em auto; padding: 0 1em; }
  .controls { display: flex; gap: .5em; align-items: center; flex-wrap: wrap; }
  .controls input[type=text] { width: 8em; font-size: 1.1em; text-transform: uppercase; }
  #msg { color: #b00; min-height: 1.3em; margin: .3em 0; }
  #layouts { display: flex; gap: .4em; flex-wrap: wrap; margin: .5em 0 1em; }
  #layouts button { flex: 1 1 0; min-width: 4.5em; padding: .5em .3em; font-size: 1em; }
  #layouts button.active { background: #8a6d1d; color: #fff; border-color: #8a6d1d; }
  #board { --tw: 56px; display: grid; gap: 0 6px; justify-content: center; margin: 1em 0; }
  .tile { grid-row-end: span 2; display: flex; align-items: center; justify-content: center;
          font-size: calc(var(--tw) * .5); font-weight: bold; background: #f3e3b3; border: 2px solid #8a6d1d;
          border-radius: 8px; margin: 1px 0; box-sizing: border-box; }
  .tile.empty { background: #eee; border-color: #bbb; }
  textarea { width: 100%; height: 26em; font-family: monospace; font-size: 1.1em; box-sizing: border-box; }
</style>
</head>
<body>
<h2>Bookworm Solver</h2>
<div id="layouts"></div>

<div class="controls">
  <label>Column
    <select id="col"></select>
  </label>
  <input type="text" id="letters" autocomplete="off" spellcheck="false" placeholder="letters">
  <button id="submit">Submit</button>
  <button id="reset">Reset</button>
</div>
<div id="msg"></div>

<div id="board"></div>

<textarea id="results" readonly placeholder="Solutions will appear here"></textarea>

<script src="words.js"></script>
<script>
(function () {
  var LAYOUTS = [
    { name: 'Light',    sizes: [2, 3, 2] },
    { name: 'Standard', sizes: [5, 6, 5, 6, 5] },
    { name: 'Medium',   sizes: [4, 5, 4, 5, 4] },
    { name: 'Dense',    sizes: [6, 7, 6, 7, 6, 7, 6] },
    { name: 'Packed',   sizes: [8, 9, 8, 9, 8, 9, 8, 9, 8] }
  ];
  var DEFAULT_LAYOUT = 'Standard';
  var SIZES = [];
  var NCOLS = 0;
  var layoutsEl = document.getElementById('layouts');
  var MAX_RESULTS = 25;

  var colSel = document.getElementById('col');
  var lettersEl = document.getElementById('letters');
  var submitBtn = document.getElementById('submit');
  var resetBtn = document.getElementById('reset');
  var msgEl = document.getElementById('msg');
  var boardEl = document.getElementById('board');
  var resultsEl = document.getElementById('results');

  var cols = [];
  var searching = false;
  var timer = null;

  // Trie of dictionary words
  var trie = {};
  var WORDS = window.WORDS || [];
  for (var i = 0; i < WORDS.length; i++) {
    var node = trie, w = WORDS[i];
    for (var k = 0; k < w.length; k++) {
      var ch = w[k];
      node = node[ch] || (node[ch] = {});
    }
    node.$ = true;
  }

  function neighbors(c, r) {
    // Adjacent columns differ by one tile; the shorter column is offset half a tile.
    var out = [];
    function add(cc, rr) {
      if (cc >= 0 && cc < NCOLS && rr >= 0 && rr < SIZES[cc]) out.push([cc, rr]);
    }
    add(c, r - 1);
    add(c, r + 1);
    [c - 1, c + 1].forEach(function (cc) {
      if (cc < 0 || cc >= NCOLS) return;
      if (SIZES[c] < SIZES[cc]) { add(cc, r); add(cc, r + 1); }
      else { add(cc, r - 1); add(cc, r); }
    });
    return out;
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    var maxRows = Math.max.apply(null, SIZES);
    var avail = boardEl.parentNode.clientWidth || 320;
    var tw = Math.max(18, Math.min(56, Math.floor((avail - 6 * (NCOLS - 1)) / NCOLS)));
    boardEl.style.setProperty('--tw', tw + 'px');
    boardEl.style.gridTemplateColumns = 'repeat(' + NCOLS + ', ' + tw + 'px)';
    boardEl.style.gridTemplateRows = 'repeat(' + (2 * maxRows) + ', ' + (tw / 2) + 'px)';
    for (var c = 0; c < NCOLS; c++) {
      for (var r = 0; r < SIZES[c]; r++) {
        var d = document.createElement('div');
        var ch = cols[c] ? cols[c][r] : '';
        d.className = 'tile' + (ch ? '' : ' empty');
        d.textContent = ch;
        d.style.gridColumn = String(c + 1);
        d.style.gridRowStart = String(SIZES[c] < maxRows ? 2 * r + 2 : 2 * r + 1);
        boardEl.appendChild(d);
      }
    }
  }

  function setMsg(t) { msgEl.textContent = t || ''; }

  function setSearching(on) {
    searching = on;
    colSel.disabled = lettersEl.disabled = submitBtn.disabled = on;
    resetBtn.textContent = on ? 'Stop' : 'Reset';
  }

  function showResults(found) {
    var list = Object.keys(found);
    list.sort(function (a, b) { return b.length - a.length || (a < b ? -1 : 1); });
    resultsEl.value = list.slice(0, MAX_RESULTS).map(function (w) {
      return w + ' (' + w.length + ')';
    }).join('\n');
  }

  function startSearch() {
    var grid = cols;
    var found = {};
    var tasks = [];
    for (var c = 0; c < NCOLS; c++) {
      for (var r = 0; r < SIZES[c]; r++) {
        neighbors(c, r).forEach(function (n) { tasks.push([c, r, n[0], n[1]]); });
      }
    }
    var used = {};
    function key(c, r) { return c * 10 + r; }

    // A Q tile counts as "QU" (two letters in the word).
    function advance(node, ch) {
      var s = ch === 'Q' ? 'QU' : ch;
      for (var i = 0; i < s.length && node; i++) node = node[s[i]];
      return node;
    }

    function dfs(c, r, node, word) {
      var ch = grid[c][r];
      node = advance(node, ch);
      if (!node) return;
      word += ch === 'Q' ? 'QU' : ch;
      if (word.length >= 3 && node.$) found[word] = true;
      if (word.length >= 8) return;
      used[key(c, r)] = true;
      var ns = neighbors(c, r);
      for (var i = 0; i < ns.length; i++) {
        if (!used[key(ns[i][0], ns[i][1])]) dfs(ns[i][0], ns[i][1], node, word);
      }
      used[key(c, r)] = false;
    }

    var idx = 0;
    resultsEl.value = 'Searching...';
    setSearching(true);

    function step() {
      var end = Date.now() + 40;
      while (idx < tasks.length && Date.now() < end) {
        var t = tasks[idx++];
        used = {};
        used[key(t[0], t[1])] = true;
        var f = grid[t[0]][t[1]];
        var node = advance(trie, f);
        if (node) dfs(t[2], t[3], node, f === 'Q' ? 'QU' : f);
      }
      showResults(found);
      if (idx < tasks.length) {
        timer = setTimeout(step, 0);
      } else {
        timer = null;
        if (!resultsEl.value) resultsEl.value = 'No words found.';
        setSearching(false);
      }
    }
    timer = setTimeout(step, 0);
  }

  submitBtn.addEventListener('click', function () {
    var c = parseInt(colSel.value, 10) - 1;
    var v = lettersEl.value.replace(/\s+/g, '').toUpperCase();
    if (!/^[A-Z]+$/.test(v)) { setMsg('Enter letters only (A-Z).'); return; }
    if (v.length !== SIZES[c]) {
      setMsg('Column ' + (c + 1) + ' needs exactly ' + SIZES[c] + ' letters.'); return;
    }
    setMsg('');
    cols[c] = v.split('');
    renderBoard();
    lettersEl.value = '';
    var next = cols.indexOf(null);
    if (next === -1) {
      startSearch();
    } else {
      colSel.value = String(next + 1);
      lettersEl.focus();
    }
  });

  lettersEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitBtn.click();
  });

  resetBtn.addEventListener('click', function () {
    if (timer) { clearTimeout(timer); timer = null; }
    if (searching) { setSearching(false); return; } // Stop: keep board and results
    resetAll();
    lettersEl.focus();
  });

  function resetAll() {
    if (timer) { clearTimeout(timer); timer = null; }
    setSearching(false);
    cols = [];
    for (var i = 0; i < NCOLS; i++) cols.push(null);
    colSel.value = '1';
    lettersEl.value = '';
    resultsEl.value = '';
    setMsg('');
    renderBoard();
    lettersEl.placeholder = 'letters (' + SIZES[0] + ')';
  }

  function selectLayout(name) {
    var L = LAYOUTS.filter(function (x) { return x.name === name; })[0] || LAYOUTS[1];
    SIZES = L.sizes.slice();
    NCOLS = SIZES.length;
    colSel.innerHTML = '';
    for (var i = 0; i < NCOLS; i++) {
      var o = document.createElement('option');
      o.value = o.textContent = String(i + 1);
      colSel.appendChild(o);
    }
    Array.prototype.forEach.call(layoutsEl.children, function (b) {
      b.className = b.textContent === L.name ? 'active' : '';
    });
    resetAll();
  }

  LAYOUTS.forEach(function (L) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = L.name;
    b.title = L.sizes.join('x');
    b.addEventListener('click', function () { selectLayout(L.name); lettersEl.focus(); });
    layoutsEl.appendChild(b);
  });

  window.addEventListener('resize', function () { if (!searching) renderBoard(); });

  if (!WORDS.length) setMsg('Dictionary (words.js) failed to load.');
  selectLayout(DEFAULT_LAYOUT);
})();
</script>
</body>
</html>
